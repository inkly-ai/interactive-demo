name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Check the generated schema reference is current
        run: |
          node scripts/docs-schema.mjs
          git diff --exit-code -- docs/schema.md
      - name: Validate and build the example project
        run: |
          node ../../packages/cli/dist/cli.js validate
          node ../../packages/cli/dist/cli.js build
        working-directory: examples/getting-started
