# Publish @inkly-org/interactive-demo-cli to the public npm registry.
# Triggered on a tag matching `cli-v*`, or manually for re-runs and the
# first publish.
#
# Release the runtime FIRST (tag `runtime-v*`): this package depends on
# @inkly-org/interactive-demo by range, and the guard below refuses to ship
# a CLI whose runtime dependency is not on the registry yet.
#
# Authentication is npm Trusted Publishing (GitHub Actions OIDC). There is
# no publish secret: the registry trusts this repository and this workflow
# filename directly. Configured per package at npmjs.com under
# Settings -> Trusted Publisher:
#
#   inkly-ai / interactive-demo, workflow `publish-cli.yml`, no environment,
#   and "Allow npm publish" CHECKED — the default grants only
#   `npm stage publish`, which would reject the direct publish below.
#
# Three requirements, each of which breaks the publish if missed:
#
#   1. `id-token: write` (below) — the OIDC token the registry exchanges.
#   2. npm >= 11.5.1 on Node >= 22.14.0. Node 22 bundles npm 10.x, which has
#      no OIDC support, so the run upgrades npm before publishing.
#   3. NODE_AUTH_TOKEN empty. npm calls the OIDC exchange unconditionally,
#      before it reads credentials, and overwrites whatever token is
#      configured — so a stale token does not block the exchange. What it does
#      is MASK a failure: left truthy, npm treats itself as authenticated,
#      proceeds to the upload, and the registry answers an unexplained 404
#      instead of a clear ENEEDAUTH. `actions/setup-node` defaults the
#      variable to a placeholder, so the empty value below is what keeps a
#      failed exchange legible rather than what makes a good one work.
#
# Trusted publishing replaced a granular access token that had to carry
# "bypass 2FA" to publish at all. npm removes direct publish from granular
# tokens in January 2027; this is the destination, not another bootstrap.

name: publish-cli

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'CLI version to publish (must match packages/cli/package.json#version)'
        required: true
        type: string

# Publishing is an explicit, tagged operation — never a push to main.
permissions:
  contents: read
  # Required for npm provenance; see publish-runtime.yml.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Points npm at the public registry. It also writes an .npmrc
          # reading NODE_AUTH_TOKEN — see the publish step, which pins that
          # variable empty so OIDC is used instead of a token.
          registry-url: 'https://registry.npmjs.org'

      # Node 22 bundles npm 10.x, which cannot exchange an OIDC token.
      # Pinned rather than `@latest`: this is the one build nobody gets to
      # re-do, and npm majors change installer behaviour (12 blocks dependency
      # install scripts by default, which CI's bundled npm 10 still runs).
      # Bump this deliberately, not by drifting.
      - name: Install the npm that trusted publishing needs
        run: |
          set -euo pipefail
          npm install -g npm@11.19.1
          npm --version
          node --version

      # Assert rather than trust the pin: a wrong npm here fails at the
      # registry with a misleading 404 rather than saying it is too old.
      # Compare the whole version, not the major — npm 11.0.0 through 11.4.x
      # ship no lib/utils/oidc.js at all and would sail past a major check.
      - name: Verify npm and Node meet the trusted-publishing floor
        run: |
          set -euo pipefail
          node -e '
            const { execSync } = require("node:child_process");
            const cmp = (a, b) => {
              const pa = a.split("-")[0].split(".").map(Number);
              const pb = b.split("-")[0].split(".").map(Number);
              for (let i = 0; i < 3; i++) {
                if ((pa[i] ?? 0) !== (pb[i] ?? 0)) return (pa[i] ?? 0) - (pb[i] ?? 0);
              }
              return 0;
            };
            const checks = [
              ["npm", execSync("npm --version").toString().trim(), "11.5.1"],
              ["Node", process.versions.node, "22.14.0"],
            ];
            let bad = false;
            for (const [name, have, min] of checks) {
              if (!/^\d+\.\d+\.\d+/.test(have)) {
                console.log(`::error::Could not parse ${name} version "${have}".`);
                bad = true;
              } else if (cmp(have, min) < 0) {
                console.log(`::error::${name} ${have} is below the trusted-publishing floor ${min}.`);
                bad = true;
              } else {
                console.log(`${name} ${have} >= ${min}`);
              }
            }
            process.exit(bad ? 1 : 0);
          '

      - name: Install dependencies
        run: npm ci

      - name: Verify package version matches the tag/input
        id: meta
        run: |
          set -euo pipefail
          PKG="packages/cli/package.json"
          PKG_VERSION="$(node -p "require('./$PKG').version")"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Tag is `refs/tags/cli-v<version>` — strip the prefix.
            TAG_VERSION="${GITHUB_REF_NAME#cli-v}"
          else
            TAG_VERSION="${{ github.event.inputs.version }}"
          fi
          if [[ "$PKG_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::$PKG version ($PKG_VERSION) does not match tag/input ($TAG_VERSION). Bump the package version, commit, and re-tag."
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved publish version: $PKG_VERSION"

      - name: Verify the runtime dependency is on the registry
        run: |
          set -euo pipefail
          # Inside this workspace the dependency resolves to the local
          # package, so nothing here would notice that `npm i -g` cannot
          # resolve it for a real user. Check the registry explicitly.
          RANGE="$(node -p "require('./packages/cli/package.json').dependencies['@inkly-org/interactive-demo']")"
          if ! npm view "@inkly-org/interactive-demo@$RANGE" version > /dev/null 2>&1; then
            echo "::error::No published @inkly-org/interactive-demo satisfies \"$RANGE\". Release the runtime first (tag runtime-v<version>), then re-tag the CLI."
            exit 1
          fi
          echo "runtime dependency \"$RANGE\" is satisfiable from npm."

      # The same bar as CI, and the root build is required rather than the
      # per-workspace one: it builds the editor before the CLI, and the CLI
      # build silently omits the editor when packages/editor/dist is absent.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify the tarball carries the editor and template
        run: |
          set -euo pipefail
          # tsup copies packages/editor/dist into dist/editor, but *skips*
          # that copy when the editor has not been built — which would ship a
          # CLI whose `dev` command serves no editor at /__demo/editor/.
          for FILE in dist/cli.js dist/capture-listener.js dist/editor/index.html; do
            if [[ ! -f "packages/cli/$FILE" ]]; then
              echo "::error::Required build artifact missing: packages/cli/$FILE"
              exit 1
            fi
          done
          if ! compgen -G "packages/cli/dist/editor/assets/*.js" > /dev/null; then
            echo "::error::packages/cli/dist/editor/assets/ has no bundle — the editor build did not land."
            exit 1
          fi
          echo "cli dist looks complete."

      - name: Refuse to overwrite an existing published version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # A successful `npm view` means the version exists — the failure case.
          if npm view "@inkly-org/interactive-demo-cli@$VERSION" version > /dev/null 2>&1; then
            echo "::error::@inkly-org/interactive-demo-cli@$VERSION is already published. npm versions are immutable — bump the version and re-tag."
            exit 1
          fi
          echo "@inkly-org/interactive-demo-cli@$VERSION is unpublished — proceeding."

      - name: Publish to npm
        env:
          # Empty, not unset. Unset leaves the literal `${NODE_AUTH_TOKEN}` in
          # setup-node's .npmrc, which is truthy; the action also defaults it
          # to a placeholder. OIDC overwrites either, so this is not what makes
          # publishing work — it is what makes a failed exchange say ENEEDAUTH
          # instead of 404.
          NODE_AUTH_TOKEN: ""
        run: |
          set -euo pipefail
          # `--access public` is required for the first scoped publish and a
          # no-op afterwards. `--provenance` is redundant under trusted
          # publishing, which attests automatically — it stays so that a lost
          # attestation fails the run rather than shipping quietly unsigned.
          npm publish \
            --workspace @inkly-org/interactive-demo-cli \
            --access public \
            --provenance

      - name: Write summary
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "## @inkly-org/interactive-demo-cli $VERSION published"
            echo
            echo "**Registry:** https://www.npmjs.com/package/@inkly-org/interactive-demo-cli/v/$VERSION"
            echo "**Install:** \`npm install -g @inkly-org/interactive-demo-cli@$VERSION\`"
            echo "**Run:** \`interactive-demo init\`"
          } >> "$GITHUB_STEP_SUMMARY"
