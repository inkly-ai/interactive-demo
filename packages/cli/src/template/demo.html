<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>demo</title>
    <link rel="stylesheet" href="./player.css" />
    <link rel="stylesheet" href="./player-fonts.css" />
    <style>
      /*
       * Player page: a light canvas with the demo player centred on it.
       * The player brings its own styles (player.css); this only lays out the
       * page around it.
       */
      :root {
        --canvas: #f5f5f5;
        --line-soft: #dddddd;
        --ink-strong: #1f1f1f;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background: var(--canvas);
        color: var(--ink-strong);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
      }
      /* Flex + a definite width give the player something concrete to size
         against; without it the player collapses to its min-content. */
      #root {
        flex: 1 1 auto;
        min-height: 0;
        min-width: 0;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--canvas);
        background-image: radial-gradient(circle at 1px 1px, rgba(0, 0, 0, 0.08) 0.5px, transparent 1px);
        background-size: 10px 10px;
        container-type: size;
      }
      .demo-wrap {
        width: 100%;
      }
      .demo-loading, .demo-error {
        padding: 24px;
        max-width: 720px;
        margin: 48px auto;
        background: #fff;
        border: 1px solid var(--line-soft);
        border-radius: 8px;
        line-height: 1.5;
        color: var(--ink-strong);
      }
      .demo-error { border-color: #ef4444; background: #fff5f5; }
      .demo-error pre {
        background: #fafafa;
        padding: 12px;
        border-radius: 6px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
        font-size: 12px;
      }
    </style>
    <!-- The demo config is embedded into this tag (parsed at render time,
         no fetch round-trip). Empty default so the page parses standalone. -->
    <script id="demo-config" type="application/json">null</script>
    <!-- assets.json's `assets[]` — the player resolves `asset:<id>` URIs in
         the config through it, to `./assets/<file>` next to this page. -->
    <script id="demo-assets" type="application/json">[]</script>
  </head>
  <body>
    <div id="root">
      <div class="demo-loading">Loading demo…</div>
    </div>
    <script src="./player.js"></script>
  </body>
</html>
